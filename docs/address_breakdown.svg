<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">32-bit address breakdown for the direct-mapped cache</title>
  <desc id="desc">Bits 31 through 10 are a 22-bit tag; bits 9 through 4 are a 6-bit line index; bits 3 through 0 are a 4-bit block offset. Offset bits 3 and 2 select one of four words, and bits 1 and 0 are zero for aligned word reads.</desc>
  <rect width="1200" height="420" fill="#f7f9fc"/>
  <text x="55" y="63" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#18263b">32-bit memory address</text>
  <text x="55" y="100" font-family="Arial, sans-serif" font-size="19" fill="#30445d">1 KB cache ÷ 16 bytes/block = 64 lines → 6 index bits</text>

  <text x="55" y="150" font-family="Arial, sans-serif" font-size="17" fill="#30445d">bit 31</text>
  <text x="707" y="150" font-family="Arial, sans-serif" font-size="17" fill="#30445d">bit 10</text>
  <text x="754" y="150" font-family="Arial, sans-serif" font-size="17" fill="#30445d">bit 9</text>
  <text x="978" y="150" font-family="Arial, sans-serif" font-size="17" fill="#30445d">bit 4</text>
  <text x="1020" y="150" font-family="Arial, sans-serif" font-size="17" fill="#30445d">bit 3</text>
  <text x="1120" y="150" font-family="Arial, sans-serif" font-size="17" fill="#30445d">bit 0</text>

  <rect x="55" y="166" width="690" height="100" rx="9" fill="#dbeafe" stroke="#2864aa" stroke-width="2"/>
  <rect x="749" y="166" width="254" height="100" rx="9" fill="#e5f5e6" stroke="#3d7e48" stroke-width="2"/>
  <rect x="1007" y="166" width="138" height="100" rx="9" fill="#fff0d7" stroke="#a96917" stroke-width="2"/>
  <text x="340" y="207" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#172338">TAG</text>
  <text x="344" y="239" font-family="Arial, sans-serif" font-size="20" fill="#172338">22 bits</text>
  <text x="829" y="207" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#172338">INDEX</text>
  <text x="836" y="239" font-family="Arial, sans-serif" font-size="20" fill="#172338">6 bits</text>
  <text x="1025" y="203" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#172338">OFFSET</text>
  <text x="1044" y="236" font-family="Arial, sans-serif" font-size="19" fill="#172338">4 bits</text>

  <text x="55" y="316" font-family="Arial, sans-serif" font-size="19" fill="#30445d">Identifies the memory block</text>
  <text x="750" y="316" font-family="Arial, sans-serif" font-size="19" fill="#30445d">Selects 1 of 64 lines</text>
  <text x="55" y="350" font-family="Arial, sans-serif" font-size="19" fill="#30445d">Within a block: offset [3:2] selects one of four words; bits [1:0] = 00 for aligned reads.</text>
  <text x="55" y="394" font-family="Arial, sans-serif" font-size="18" fill="#30445d">Example: 0x00000000 and 0x00000400 have the same index (0), but different tags (0 and 1).</text>
</svg>
